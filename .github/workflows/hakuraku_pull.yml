name: hakuraku_pull

# Moved to this PUBLIC repo (free minutes) on 2 Nov 2026, Aryu's go. Runs tools/hakuraku_job.py from the private course repo and stores there
# with the secret COURSE_TOKEN. NO DATA is printed in this log (public): only counts. Schedule ON since 2 Nov 2026 (Aryu's go).
# One run = one sitting; BUDGET_MIN minutes of pulling (default 50 for an hourly run). Manual: Actions > hakuraku_pull > Run workflow.
# Two timed starts per hour (minutes 13 and 43, changed 2 Nov: minute 17 never fired); the concurrency group keeps one run at a time.
# Do not run a browser sitting at the same time: both start from the same next rank.
on:
  schedule:
    - cron: '13 * * * *'
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      races:
        description: 'Races in this run (default 1000)'
        default: '1000'
      budget:
        description: 'Minutes of pulling (default 50)'
        default: '50'
      dry:
        description: 'true = test only, nothing stored'
        default: 'false'

concurrency:
  group: hakuraku-pull
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull:
    runs-on: ubuntu-latest   # public repo = free; per Aryu's rule the dearest Linux runner while it is free
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jeremiahbnjmn/umalyfe-real-kyoto2200
          token: ${{ secrets.COURSE_TOKEN }}
          path: course
          filter: 'blob:none'
          sparse-checkout: |
            /tools/
            /cm19-2026-09-19/order.tsv.gz
            /cm19-2026-09-19/pull_state.json
            /cm19-2026-09-19/layout_ref.json
            /cm19-2026-09-19/pull_job_log.tsv
          sparse-checkout-cone-mode: false
      - name: Pull
        working-directory: course
        env:
          MAX_RACES: ${{ github.event.inputs.races || '1000' }}
          BUDGET_MIN: ${{ github.event.inputs.budget || '50' }}
          DRY: ${{ github.event.inputs.dry || 'false' }}
        run: python3 -I tools/hakuraku_job.py
      - name: Store
        if: ${{ github.event.inputs.dry != 'true' }}
        working-directory: course
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse cm19-2026-09-19/teams cm19-2026-09-19/replays cm19-2026-09-19/pull_state.json cm19-2026-09-19/pull_job_log.tsv
          if git diff --cached --quiet; then echo "nothing to store"; exit 0; fi
          git commit -q -m "hakuraku_pull: $(tail -n 1 cm19-2026-09-19/pull_job_log.tsv | cut -f1,2)"
          git push -q
      - name: Stop when the list has ended
        if: ${{ hashFiles('/tmp/hakuraku_done') != '' }}
        env:
          GH_TOKEN: ${{ secrets.COURSE_TOKEN }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/hakuraku_pull.yml/disable
